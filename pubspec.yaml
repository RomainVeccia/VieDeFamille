name: vie_de_famille
description: "App mobile de gestion familiale — tâches, courses, planning, budget."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage local
  sqflite: ^2.4.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Firebase (sync famille, auth, notifications)
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.0.0

  # Calendrier
  table_calendar: ^3.1.3

  # Graphiques budget
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2

  # Photos (reçus, profils)
  image_picker: ^1.1.2

  # Utilitaires
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/
